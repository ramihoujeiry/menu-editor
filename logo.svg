<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 1000" width="200" height="1000">
  <!-- Background -->
  <rect width="200" height="1000" fill="#34383A"/>
  
  <!-- Gold crown at top -->
  <g transform="translate(100, 35)">
    <path d="M-25,10 L-25,-15 L-15,-5 L0,-20 L15,-5 L25,-15 L25,10 Z" fill="#EEC01B" stroke="#EEC01B" stroke-width="1"/>
    <circle cx="-25" cy="10" r="4" fill="#EEC01B"/>
    <circle cx="0" cy="10" r="4" fill="#EEC01B"/>
    <circle cx="25" cy="10" r="4" fill="#EEC01B"/>
    <rect x="-28" y="10" width="56" height="6" rx="2" fill="#EEC01B"/>
  </g>
  
  <!-- Circle with T -->
  <g transform="translate(100, 105)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#EEC01B" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#EEC01B">T</text>
  </g>
  
  <!-- TOTANGO text -->
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#EEC01B" letter-spacing="2">TOTANGO</text>
  
  <!-- RESTAURANT text -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#EEC01B" letter-spacing="3">RESTAURANT</text>
  
  <!-- Decorative line -->
  <line x1="30" y1="215" x2="170" y2="215" stroke="#EEC01B" stroke-width="1"/>
  
  <!-- Phone numbers -->
  <text x="100" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#EEC01B">Tel : 06 834 16 68</text>
  <text x="100" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#EEC01B">05 064 31 31</text>
  
  <!-- Decorative line -->
  <line x1="30" y1="275" x2="170" y2="275" stroke="#EEC01B" stroke-width="1"/>
  
  <!-- Yellow MENU Circle -->
  <g transform="translate(100, 380)">
    <circle cx="0" cy="0" r="90" fill="#EEC01B" stroke="#d4a832" stroke-width="2"/>
    
    <!-- Cloche icon (hand holding serving cover) -->
    <g transform="translate(0, -45)">
      <!-- Hand -->
      <path d="M-20,10 Q-25,0 -15,-5 L15,-5 Q25,0 20,10 Z" fill="#34383A"/>
      <!-- Cloche dome -->
      <ellipse cx="0" cy="-15" rx="30" ry="20" fill="#34383A"/>
      <!-- Cloche rim -->
      <ellipse cx="0" cy="0" rx="32" ry="5" fill="#34383A"/>
      <!-- Handle -->
      <circle cx="0" cy="-32" r="6" fill="#34383A"/>
    </g>
    
    <!-- MENU text -->
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a" letter-spacing="4">MENU</text>
    
    <!-- Decorative dots/lines under MENU -->
    <line x1="-40" y1="55" x2="-10" y2="55" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="0" cy="55" r="3" fill="#1a1a1a"/>
    <line x1="10" y1="55" x2="40" y2="55" stroke="#1a1a1a" stroke-width="2"/>
  </g>
</svg>
