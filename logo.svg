<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 1123" width="160" height="1123">
  <!-- Background -->
  <rect width="160" height="1123" fill="#34383A"/>

  <!-- Gold top & bottom bars -->
  <rect x="0" y="0" width="160" height="4" fill="#EEC01B"/>
  <rect x="0" y="1119" width="160" height="4" fill="#EEC01B"/>

  <!-- Crown -->
  <g transform="translate(80, 62)">
    <path d="M-20,7 L-20,-11 L-11,-3 L0,-15 L11,-3 L20,-11 L20,7 Z" fill="#EEC01B"/>
    <circle cx="-20" cy="7" r="3" fill="#EEC01B"/>
    <circle cx="0" cy="7" r="3" fill="#EEC01B"/>
    <circle cx="20" cy="7" r="3" fill="#EEC01B"/>
    <rect x="-23" y="7" width="46" height="4.5" rx="1.5" fill="#EEC01B"/>
  </g>

  <!-- Circle with T -->
  <g transform="translate(80, 145)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#EEC01B" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#EEC01B">T</text>
  </g>

  <!-- TOTANGO -->
  <text x="80" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#EEC01B" letter-spacing="1.5">TOTANGO</text>

  <!-- Decorative divider -->
  <line x1="28" y1="242" x2="66" y2="242" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="74" cy="242" r="2.2" fill="#EEC01B"/>
  <circle cx="86" cy="242" r="2.2" fill="#EEC01B"/>
  <line x1="94" y1="242" x2="132" y2="242" stroke="#EEC01B" stroke-width="0.8"/>

  <!-- RESTAURANT -->
  <text x="80" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#EEC01B" letter-spacing="2.8">RESTAURANT</text>

  <line x1="35" y1="288" x2="125" y2="288" stroke="#EEC01B" stroke-width="0.8"/>

  <!-- Phone numbers -->
  <text x="80" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#EEC01B">Tel : 06 834 16 68</text>
  <text x="80" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#EEC01B">/ 05 064 31 31</text>

  <!-- Ornament -->
  <line x1="30" y1="368" x2="70" y2="368" stroke="#EEC01B" stroke-width="0.8"/>
  <path d="M80 361 L87 368 L80 375 L73 368 Z" fill="#EEC01B"/>
  <line x1="90" y1="368" x2="130" y2="368" stroke="#EEC01B" stroke-width="0.8"/>

  <!-- MENU circle -->
  <g transform="translate(80, 500)">
    <circle cx="0" cy="0" r="72" fill="#EEC01B" stroke="#d4a832" stroke-width="1.5"/>
    <g transform="translate(0, -40)">
      <path d="M-18,8 Q-22,0 -12,-4 L12,-4 Q22,0 18,8 Z" fill="#34383A"/>
      <ellipse cx="0" cy="-12" rx="25" ry="16" fill="#34383A"/>
      <ellipse cx="0" cy="0" rx="27" ry="4" fill="#34383A"/>
      <circle cx="0" cy="-26" r="5" fill="#34383A"/>
    </g>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#1a1a1a" letter-spacing="3.5">MENU</text>
    <line x1="-33" y1="47" x2="-8" y2="47" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="0" cy="47" r="2.5" fill="#1a1a1a"/>
    <line x1="8" y1="47" x2="33" y2="47" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>

  <!-- BON APPETIT -->
  <line x1="30" y1="640" x2="70" y2="640" stroke="#EEC01B" stroke-width="0.8"/>
  <path d="M80 633 L87 640 L80 647 L73 640 Z" fill="#EEC01B"/>
  <line x1="90" y1="640" x2="130" y2="640" stroke="#EEC01B" stroke-width="0.8"/>
  <text x="80" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#EEC01B" letter-spacing="1">Bon appétit</text>

  <!-- Large watermark monogram -->
  <g transform="translate(80, 850)" opacity="0.28">
    <circle cx="0" cy="0" r="82" fill="none" stroke="#EEC01B" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#EEC01B" stroke-width="0.6"/>
    <text x="0" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#EEC01B">T</text>
  </g>

  <!-- Bottom ornament -->
  <line x1="40" y1="1010" x2="72" y2="1010" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="80" cy="1010" r="2.2" fill="#EEC01B"/>
  <line x1="88" y1="1010" x2="120" y2="1010" stroke="#EEC01B" stroke-width="0.8"/>

  <line x1="30" y1="1058" x2="130" y2="1058" stroke="#EEC01B" stroke-width="0.6"/>
  <text x="80" y="1086" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#EEC01B" letter-spacing="2">TOTANGO</text>
</svg>
