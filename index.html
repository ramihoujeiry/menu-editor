<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOTANGO RESTAURANT - Menu Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-page: #34383A;
      --bg-card: #242424;
      --bg-input: #2e2e2e;
      --gold: #EEC01B;
      --gold-dark: #d4a832;
      --text: #ffffff;
      --text-dim: #aaa;
      --border: #3a3a3a;
      --danger: #e74c3c;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-card);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    
    #app { display: flex; height: 100vh; }
    
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 340px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: width 0.3s, margin-left 0.3s;
    }
    
    .sidebar.hidden {
      width: 0;
      margin-left: -340px;
      border-right: none;
    }
    
    .sidebar-toggle {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 100;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    
    .sidebar-toggle:hover { background: #f5d03a; }
    
    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: 1px;
    }
    
    .sidebar-header p {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    
    .menu-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    
    .menu-tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.2s;
    }
    
    .menu-tab:hover { background: var(--bg-input); color: var(--text); }
    .menu-tab.active { background: var(--gold); color: #000; }
    
    .editor-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 6px;
    }
    
    .section-header:first-child { margin-top: 0; }
    
    .section-header h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
    }
    
    .add-item-btn {
      background: transparent;
      border: 1px dashed var(--gold-dark);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .add-item-btn:hover { background: var(--gold); color: #000; }
    
    .item-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    
    .item-card:hover { border-color: var(--gold-dark); }
    
    .item-card .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .item-card input, .item-card textarea {
      background: var(--bg-page);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.2s;
    }
    
    .item-card input:focus, .item-card textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    
    .item-card input.item-price { width: 70px; text-align: center; font-weight: 600; color: var(--gold); }
    
    .item-card textarea.item-desc {
      resize: vertical;
      min-height: 28px;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    
    .delete-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    
    .delete-btn:hover { color: var(--danger); background: rgba(231,76,60,0.1); }
    
    .add-section-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px dashed var(--gold-dark);
      color: var(--gold);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }
    
    .add-section-btn:hover { background: var(--gold); color: #000; }
    
    /* ===== PREVIEW ===== */
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .preview-toolbar {
      padding: 14px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .preview-toolbar h2 {
      font-size: 15px;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }
    
    .toolbar-actions { display: flex; gap: 8px; }
    
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: #f5d03a; }
    .btn-outline { background: transparent; border: 1px solid var(--gold-dark); color: var(--gold); }
    .btn-outline:hover { background: var(--gold); color: #000; }
    
    /* ===== MENU PAGE CONTAINER ===== */
    .preview-scroll {
      flex: 1;
      overflow: hidden;
      padding: 0;
      background: #1a1a1a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .page-scaler {
      transform-origin: center center;
      flex-shrink: 0;
    }
    
    /* ===== MENU PAGE - EXACT REPLICA ===== */
    .menu-page {
      width: 794px;
      height: 1123px;
      background: #34383A;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    
    /* Gold border at top */
    .menu-page::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #EEC01B;
      z-index: 10;
    }
    
    /* Main content area */
    .menu-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0 15px;
      padding: 20px 15px 20px 20px;
      height: 1123px;
      margin-right: 160px;
      overflow: hidden;
    }
    
    .menu-col {
      display: flex;
      flex-direction: column;
    }
    
    /* ===== SECTION HEADERS ===== */
    .menu-section {
      margin-bottom: 8px;
    }
    
    .menu-section-title {
      display: inline-block;
      background: #EEC01B;
      color: #000;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 4px;
      font-family: 'Inter', sans-serif;
    }
    
    /* ===== MENU ITEMS ===== */
    .menu-item {
      padding: 1px 0;
    }
    
    .menu-item-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    
    .menu-item-name {
      font-size: 10px;
      font-weight: 400;
      color: #fff;
      line-height: 1.2;
      font-family: 'Inter', sans-serif;
      flex: 1;
    }
    
    .menu-item-price {
      font-size: 10px;
      font-weight: 400;
      color: #fff;
      white-space: nowrap;
      margin-left: 6px;
      font-family: 'Inter', sans-serif;
    }
    
    /* ===== LOGO SIDEBAR ===== */
    .logo-sidebar {
      width: 160px;
      background: #34383A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 5px;
      border-left: 1px solid #444;
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: hidden;
      justify-content: flex-start;
    }
    
    .logo-sidebar img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 100%;
      object-fit: contain;
    }
    
    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--gold-dark);
      border-radius: 12px;
      padding: 28px;
      width: 380px;
      max-width: 90vw;
    }
    
    .modal h3 {
      color: var(--gold);
      margin-bottom: 16px;
      font-family: 'Playfair Display', serif;
      font-size: 18px;
    }
    
    .modal label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      margin-top: 12px;
    }
    
    .modal input, .modal select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    
    .modal input:focus, .modal select:focus {
      outline: none;
      border-color: var(--gold);
    }
    
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    
    /* ===== PRINT ===== */
    @media print {
      @page {
        size: A4;
        margin: 0 !important;
      }
      body {
        background: #34383A !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 794px !important;
        height: 1123px !important;
      }
      .sidebar, .preview-toolbar, .sidebar-toggle, .preview-scroll { display: none !important; }
      .preview-container {
        display: block !important;
        width: 794px !important;
        height: 1123px !important;
        overflow: hidden !important;
        background: #34383A !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .page-scaler {
        transform: none !important;
      }
      .menu-page {
        box-shadow: none !important;
        margin: 0 !important;
        width: 794px !important;
        height: 1123px !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-page); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }
  </style>
</head>
<body>
  <div id="app">
    <!-- SIDEBAR TOGGLE -->
    <button class="sidebar-toggle" @click="sidebarHidden = !sidebarHidden">
      {{ sidebarHidden ? '☰' : '✕' }}
    </button>
    
    <!-- SIDEBAR EDITOR -->
    <div class="sidebar" :class="{ hidden: sidebarHidden }">
      <div class="sidebar-header">
        <h1>TOTANGO RESTAURANT</h1>
        <p>Menu Editor — Tel: 068341668 / 050643131</p>
      </div>
      
      <div class="menu-tabs">
        <button 
          v-for="(menu, idx) in menus" 
          :key="idx"
          :class="['menu-tab', { active: currentMenu === idx }]"
          @click="currentMenu = idx"
        >{{ menu.name }}</button>
      </div>
      
      <div class="editor-area">
        <div v-for="(section, sIdx) in menus[currentMenu].sections" :key="sIdx">
          <div class="section-header">
            <h3>{{ section.title }}</h3>
            <button class="add-item-btn" @click="addItem(sIdx)">+ Item</button>
          </div>
          
          <div 
            v-for="(item, iIdx) in section.items" 
            :key="iIdx"
            class="item-card"
          >
            <div class="row">
              <input class="item-name" v-model="item.name" placeholder="Item name"/>
              <input class="item-price" v-model="item.price" placeholder="0"/>
              <button class="delete-btn" @click="deleteItem(sIdx, iIdx)" title="Delete">×</button>
            </div>
            <textarea class="item-desc" v-model="item.description" placeholder="Description (optional)" rows="1"></textarea>
          </div>
        </div>
        
        <button class="add-section-btn" @click="addSection()">+ Add Section</button>
      </div>
    </div>
    
    <!-- PREVIEW -->
    <div class="preview-container">
      <div class="preview-toolbar">
        <h2>{{ menus[currentMenu].name }}</h2>
        <div class="toolbar-actions">
          <button class="btn btn-outline" @click="exportJSON()">Export JSON</button>
          <button class="btn btn-gold" @click="printPDF()">🖨 Print / Save PDF</button>
        </div>
      </div>
      
      <div class="preview-scroll" ref="scrollContainer">
        <div class="page-scaler" :style="{ transform: 'scale(' + pageScale + ')' }">
          <div class="menu-page" :id="'menu-page-' + currentMenu">
            <!-- Main Content -->
            <div class="menu-content">
              <!-- Left Column -->
              <div class="menu-col">
                <template v-for="(section, sIdx) in menus[currentMenu].columns[0]" :key="'c0-'+sIdx">
                  <div class="menu-section" v-if="section.title && section.items.length">
                    <div class="menu-section-title">{{ section.title }}</div>
                    <div v-for="(item, iIdx) in section.items" :key="iIdx" class="menu-item">
                      <div class="menu-item-line">
                        <span class="menu-item-name">{{ item.name }}</span>
                        <span class="menu-item-price">{{ item.price }}</span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              
              <!-- Middle Column -->
              <div class="menu-col">
                <template v-for="(section, sIdx) in menus[currentMenu].columns[1]" :key="'c1-'+sIdx">
                  <div class="menu-section" v-if="section.title && section.items.length">
                    <div class="menu-section-title">{{ section.title }}</div>
                    <div v-for="(item, iIdx) in section.items" :key="iIdx" class="menu-item">
                      <div class="menu-item-line">
                        <span class="menu-item-name">{{ item.name }}</span>
                        <span class="menu-item-price">{{ item.price }}</span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              
              <!-- Right Column (before logo) -->
              <div class="menu-col">
                <template v-for="(section, sIdx) in menus[currentMenu].columns[2]" :key="'c2-'+sIdx">
                  <div class="menu-section" v-if="section.title && section.items.length">
                    <div class="menu-section-title">{{ section.title }}</div>
                    <div v-for="(item, iIdx) in section.items" :key="iIdx" class="menu-item">
                      <div class="menu-item-line">
                        <span class="menu-item-name">{{ item.name }}</span>
                        <span class="menu-item-price">{{ item.price }}</span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            
            <!-- Logo Sidebar -->
            <div class="logo-sidebar">
              <img src="logo.svg" alt="TOTANGO RESTAURANT" />
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- ADD ITEM MODAL -->
    <div v-if="showAddModal" class="modal-overlay" @click.self="showAddModal = false">
      <div class="modal">
        <h3>Add New Item</h3>
        <label>Item Name</label>
        <input v-model="newItem.name" placeholder="e.g. Omelette Nature" @keyup.enter="confirmAddItem"/>
        <label>Price</label>
        <input v-model="newItem.price" placeholder="e.g. 2.500" @keyup.enter="confirmAddItem"/>
        <label>Description (optional)</label>
        <input v-model="newItem.description" placeholder="e.g. With herbs and spices"/>
        <div class="modal-actions">
          <button class="btn btn-outline" @click="showAddModal = false">Cancel</button>
          <button class="btn btn-gold" @click="confirmAddItem">Add Item</button>
        </div>
      </div>
    </div>
    
    <!-- ADD SECTION MODAL -->
    <div v-if="showSectionModal" class="modal-overlay" @click.self="showSectionModal = false">
      <div class="modal">
        <h3>Add New Section</h3>
        <label>Section Title</label>
        <input v-model="newSectionTitle" placeholder="e.g. DESSERTS" @keyup.enter="confirmAddSection"/>
        <label>Column</label>
        <select v-model="newSectionColumn">
          <option value="0">Left</option>
          <option value="1">Middle</option>
          <option value="2">Right</option>
        </select>
        <div class="modal-actions">
          <button class="btn btn-outline" @click="showSectionModal = false">Cancel</button>
          <button class="btn btn-gold" @click="confirmAddSection">Add Section</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, onBeforeUnmount } = Vue;
    
    createApp({
      setup() {
        const currentMenu = ref(0);
        const sidebarHidden = ref(false);
        const showAddModal = ref(false);
        const showSectionModal = ref(false);
        const addItemTarget = ref({ col: 0, sec: 0 });
        const newItem = ref({ name: '', price: '', description: '' });
        const newSectionTitle = ref('');
        const newSectionColumn = ref('0');
        const pageScale = ref(1);
        const scrollContainer = ref(null);
        
        // Dynamic scaling to fit page in viewport
        function updateScale() {
          if (!scrollContainer.value) return;
          const rect = scrollContainer.value.getBoundingClientRect();
          const availW = rect.width - 40;  // 20px margin each side
          const availH = rect.height - 40;
          const pageW = 794;
          const pageH = 1123;
          const scale = Math.min(availW / pageW, availH / pageH);
          pageScale.value = Math.min(scale, 1); // never scale up
        }
        
        onMounted(() => {
          updateScale();
          window.addEventListener('resize', updateScale);
        });
        
        onBeforeUnmount(() => {
          window.removeEventListener('resize', updateScale);
        });
        
        // Helper: build column layout from flat sections
        // Distribute sections by item count for balanced columns
        function buildColumns(sections) {
          const cols = [[], [], []];
          // Calculate total items per section
          const sectionItems = sections.map(s => s.items.length);
          const totalItems = sectionItems.reduce((a, b) => a + b, 0);
          const targetPerCol = Math.ceil(totalItems / 3);
          
          let colIdx = 0;
          let colItems = 0;
          
          sections.forEach((sec, i) => {
            // If adding this section would exceed target and we have items, move to next col
            if (colItems > 0 && colItems + sec.items.length > targetPerCol && colIdx < 2) {
              colIdx++;
              colItems = 0;
            }
            cols[colIdx].push(sec);
            colItems += sec.items.length;
          });
          
          return cols;
        }
        
        const menus = ref([
          {
            name: 'FOOD I',
            sections: [
              { title: 'OMELETTES', items: [
                { name: 'OMELETTE NATURE', price: '2.500' },
                { name: 'OMELETTE JAMBON', price: '3.000' },
                { name: 'OMELETTE FROMAGE', price: '3.000' },
                { name: 'OMELETTE JAMBON FROMAGE', price: '3.500' },
                { name: 'OMELETTE VIANDE HACHÉE', price: '3.000' },
                { name: 'OMELETTE MIXTE', price: '3.500' },
                { name: 'OMELETTE EXTRA', price: '4.000' },
              ]},
              { title: 'SALADES', items: [
                { name: 'SALADE AVOCAT', price: '4.500' },
                { name: 'SALADE DU CHEF', price: '4.500' },
                { name: 'SALADE DE CRUDITÉ', price: '3.500' },
                { name: 'SALADE NIÇOISE', price: '4.500' },
                { name: 'SALADE DE JAMBON', price: '4.000' },
                { name: 'SALADE AVOCAT AU THON', price: '4.500' },
                { name: 'SALADE CÉSAR', price: '5.000' },
                { name: 'SALADE FRANÇAISE', price: '4.000' },
                { name: 'SALADE TOTANGO', price: '5.000' },
              ]},
              { title: 'PLATS PRINCIPAUX', items: [
                { name: '1/4 POULET GRILLÉ SAUCE TOMATE', price: '6.000' },
                { name: 'POULET DG', price: '6.000' },
                { name: 'PILON DE POULET', price: '5.000' },
                { name: 'CUISSE DE POULET FRITE', price: '4.500' },
                { name: 'CUISSE SAUTÉE AUX PETITS POIS', price: '5.000' },
                { name: 'KFC POULET', price: '5.500' },
                { name: 'ÉMINCÉ DE VIANDE', price: '6.000' },
                { name: 'ÉMINCÉ DE POULET', price: '5.500' },
                { name: 'RAGOÛT DE VIANDE', price: '6.000' },
                { name: 'RAGOÛT DE POULET', price: '5.500' },
                { name: 'STEAK NATURE', price: '6.000' },
                { name: 'STEAK AUX PETITS POIS', price: '6.500' },
                { name: 'STEAK AUX CHAMPIGNONS CRÈME', price: '7.500' },
                { name: 'STEAK AUX FROMAGES FONDANT', price: '7.000' },
                { name: 'STEAK AUX LÉGUMES SAUTÉS', price: '6.500' },
                { name: 'BŒUF AUX CHAMPIGNONS', price: '6.000' },
              ]},
              { title: 'PLATS AFRICAINS', items: [

          const menuPage = document.querySelector('.menu-page');
          if (!menuPage) return;
          
          // Use html2canvas to capture the menu with correct background
          html2canvas(menuPage, {
            backgroundColor: '#34383A',
            scale: 2,
            useCORS: true,
            logging: false
          }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            
            // Calculate image dimensions to fit page
            const imgWidth = pageWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            // If image is taller than page, scale to fit
            if (imgHeight > pageHeight) {
              const ratio = pageHeight / imgHeight;
              pdf.addImage(imgData, 'PNG', 0, 0, imgWidth * ratio, pageHeight * ratio);
            } else {
              pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            }
            
            pdf.save('TOTANGO-Menu.pdf');
          });
        }
        
        function exportJSON() {
          const blob = new Blob([JSON.stringify(menus.value, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'menu-data.json';
          a.click();
          URL.revokeObjectURL(url);
        }
        
        return {
