<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 425" width="270" height="425">
  <!-- Background -->
  <rect width="270" height="425" fill="#34383A"/>
  
  <!-- Gold crown at top -->
  <g transform="translate(135, 30)">
    <path d="M-22,8 L-22,-12 L-12,-3 L0,-16 L12,-3 L22,-12 L22,8 Z" fill="#EEC01B"/>
    <circle cx="-22" cy="8" r="3.5" fill="#EEC01B"/>
    <circle cx="0" cy="8" r="3.5" fill="#EEC01B"/>
    <circle cx="22" cy="8" r="3.5" fill="#EEC01B"/>
    <rect x="-25" y="8" width="50" height="5" rx="1.5" fill="#EEC01B"/>
  </g>
  
  <!-- Circle with T -->
  <g transform="translate(135, 90)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#EEC01B" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#EEC01B">T</text>
  </g>
  
  <!-- TOTANGO text -->
  <text x="135" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#EEC01B" letter-spacing="1.5">TOTANGO</text>
  
  <!-- Decorative lines -->
  <line x1="50" y1="165" x2="105" y2="165" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="115" cy="165" r="2.5" fill="#EEC01B"/>
  <circle cx="135" cy="165" r="2.5" fill="#EEC01B"/>
  <line x1="145" y1="165" x2="165" y2="165" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="175" cy="165" r="2.5" fill="#EEC01B"/>
  <line x1="185" y1="165" x2="220" y2="165" stroke="#EEC01B" stroke-width="0.8"/>
  
  <!-- RESTAURANT text -->
  <text x="135" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#EEC01B" letter-spacing="2.5">RESTAURANT</text>
  
  <!-- Decorative lines -->
  <line x1="40" y1="200" x2="110" y2="200" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="135" cy="200" r="2.5" fill="#EEC01B"/>
  <line x1="160" y1="200" x2="230" y2="200" stroke="#EEC01B" stroke-width="0.8"/>
  
  <!-- Phone numbers -->
  <text x="135" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#EEC01B">Tel : 06 834 16 68</text>
  <text x="135" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#EEC01B">/ 05 064 31 31</text>
  
  <!-- Decorative lines -->
  <line x1="40" y1="255" x2="110" y2="255" stroke="#EEC01B" stroke-width="0.8"/>
  <circle cx="135" cy="255" r="2.5" fill="#EEC01B"/>
  <line x1="160" y1="255" x2="230" y2="255" stroke="#EEC01B" stroke-width="0.8"/>
  
  <!-- Yellow MENU Circle -->
  <g transform="translate(135, 340)">
    <circle cx="0" cy="0" r="70" fill="#EEC01B" stroke="#d4a832" stroke-width="1.5"/>
    
    <!-- Cloche icon (hand holding serving cover) -->
    <g transform="translate(0, -38)">
      <!-- Hand/arm -->
      <path d="M-18,8 Q-22,0 -12,-4 L12,-4 Q22,0 18,8 Z" fill="#34383A"/>
      <!-- Cloche dome -->
      <ellipse cx="0" cy="-12" rx="25" ry="16" fill="#34383A"/>
      <!-- Cloche rim -->
      <ellipse cx="0" cy="0" rx="27" ry="4" fill="#34383A"/>
      <!-- Handle knob -->
      <circle cx="0" cy="-26" r="5" fill="#34383A"/>
    </g>
    
    <!-- MENU text -->
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" letter-spacing="3">MENU</text>
    
    <!-- Decorative lines under MENU -->
    <line x1="-32" y1="45" x2="-8" y2="45" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="0" cy="45" r="2.5" fill="#1a1a1a"/>
    <line x1="8" y1="45" x2="32" y2="45" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
</svg>
