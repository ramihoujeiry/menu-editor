name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check expected files exist
        run: |
          test -f dist/index.html
          test -f dist/logo.svg
          test -f dist/vendor/vue.global.prod.js
          test -f dist/vendor/html2canvas.min.js
          test -f dist/vendor/jspdf.umd.min.js
